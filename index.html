<head>

<title>Prospection 25300</title>
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#12262B; --muted:#586C71; --line:#D3DDDB;
  --accent:#0B6B5C; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA; --danger:#B3362D; --shade:rgba(0,0,0,.45);
  --s-todo:#7B8C90; --s-contacted:#B97A00; --s-callback:#6D4FD0; --s-interested:#1C8A52; --s-declined:#B3362D;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A1C; --surface:#152629; --ink:#E7F0EE; --muted:#8FA6AA; --line:#27403F;
    --accent:#4CC3A3; --accent-ink:#06231C; --accent-soft:#17352F; --danger:#F08076; --shade:rgba(0,0,0,.6);
    --s-todo:#8FA6AA; --s-contacted:#E2A63A; --s-callback:#A18CF0; --s-interested:#4FC98A; --s-declined:#F08076;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A1C; --surface:#152629; --ink:#E7F0EE; --muted:#8FA6AA; --line:#27403F;
  --accent:#4CC3A3; --accent-ink:#06231C; --accent-soft:#17352F; --danger:#F08076; --shade:rgba(0,0,0,.6);
  --s-todo:#8FA6AA; --s-contacted:#E2A63A; --s-callback:#A18CF0; --s-interested:#4FC98A; --s-declined:#F08076;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.4;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:640px;margin:0 auto;padding:0 16px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 12px}
header.top h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.1}
header.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink);min-height:40px}
.ghost:active{background:var(--accent-soft)}

.niches{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.niches::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:6px 16px 10px;margin:0 -16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:56px;min-width:0}
.tab b{font-size:21px;line-height:1.1;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tab span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:var(--accent-ink);opacity:.9}

.filters{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 8px}
.filters .total{font-size:14px;color:var(--muted)}
.select{position:relative}
select{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 32px 9px 12px;font-size:16px;min-height:44px}
.select::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

.city{margin-top:14px}
.city h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:18px;letter-spacing:-.01em}
.city h2 .count{font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.name{margin:0;font-size:17px;line-height:1.25;letter-spacing:-.01em}
.addr{margin:3px 0 0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tag.warn{background:transparent;border:1px solid var(--s-contacted);color:var(--s-contacted)}
.note{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:650;font-size:15px;text-decoration:none;font-variant-numeric:tabular-nums}
.pill.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.status{position:relative;flex:1;display:block}
.status select{width:100%;padding-left:30px;font-weight:650}
.status .dot{position:absolute;left:12px;top:50%;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);background:var(--s-todo);pointer-events:none}
.status[data-s="contacted"] .dot{background:var(--s-contacted)}
.status[data-s="callback"] .dot{background:var(--s-callback)}
.status[data-s="interested"] .dot{background:var(--s-interested)}
.status[data-s="declined"] .dot{background:var(--s-declined)}
.status::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.when{margin:8px 0 0;font-size:13px;color:var(--muted)}
.details{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:12px}
.field{display:grid;gap:5px;font-size:14px;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:400;min-height:44px}
.field textarea{min-height:92px;resize:vertical}
.danger{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:10px;min-height:44px;font-weight:650}
.danger.confirm{background:var(--danger);color:var(--bg)}

.empty{margin:28px 0;padding:22px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;min-height:54px;padding:0 22px;font-weight:700;font-size:17px;box-shadow:0 6px 18px var(--shade)}

.backdrop{position:fixed;inset:0;background:var(--shade);z-index:40;display:none}
.backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto;display:none;max-width:640px;margin:0 auto}
.sheet.open{display:block}
.sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.01em}
.sheet .grid{display:grid;gap:12px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions button{flex:1}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;z-index:60;opacity:0;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: no-preference){.toast{transition:opacity .2s}}
</style>
</head>

</section>

  <div class="actions">

    <button class="btn primary" id="restoreBackup" type="button">Restaurer</button>
  </div>
  <div class="actions"><button class="btn" id="closeBackup" type="button">Fermer</button></div>
</section>

  function loadState(){
    var s = null;

    if (!s || !Array.isArray(s.items)) s = { items: [], removed: [], tab: "none", niche: "all", status: "all" };
    if (!Array.isArray(s.removed)) s.removed = [];
    if (!CAT_LONG[s.tab]) s.tab = "none";
    if (!s.niche) s.niche = "all";
    if (s.status !== "all" && !STATUS_OK[s.status]) s.status = "all";
    s.items = s.items.filter(function(i){ return i && !(/^seed-\d{3}$/.test(i.id) && i.status === "todo" && !i.changed); });
    SEED.forEach(function(seed){
      var exists = s.items.some(function(i){ return i.id === seed.id; });
      if (!exists && s.removed.indexOf(seed.id) === -1) {
        var copy = {}; for (var k in seed) copy[k] = seed[k];
        copy.tags = seed.tags.slice();
        copy.status = "todo"; copy.changed = null;
        s.items.push(copy);

    return s;

  function normUrl(u){
    u = (u || "").trim();
    if (!u) return "";
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^[^:\/]+:\d/.test(u)) return "";
    return "https://" + u;
  }
  function hostOf(url){

    var ta = $("#backupText");
    if (!ta.value) ta.value = backupText();
    function fallback(){
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e) { ok = false; }
      toast(ok ? "Copié." : "Copie impossible. Le texte est sélectionné, copie-le à la main.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function(){ toast("Copié."); }, fallback);
    } else {
      fallback();
    }
  });
  $("#restoreBackup").addEventListener("click", function(){
    var raw = $("#backupText").value.trim();
    if (!raw) { toast("Colle d’abord une sauvegarde dans le champ."); return; }
    var data;
    try { data = JSON.parse(raw); } catch(e) { toast("Ce texte n’est pas une sauvegarde valide."); return; }
    if (!data || !Array.isArray(data.items)) { toast("Ce texte n’est pas une sauvegarde valide."); return; }
    var added = 0;
    data.items.forEach(function(n){
      if (!n || !n.name) return;
      var item = {
        id: String(n.id || uid()), niche: n.niche || "Sans niche", name: String(n.name), address: n.address || "",
        city: n.city || "Pontarlier", phone: n.phone || "", site: normUrl(n.site),
        category: CAT_LONG[n.category] ? n.category : "verify",
        status: STATUS_OK[n.status] ? n.status : "todo", changed: n.changed || null, notes: n.notes || "",
        tags: Array.isArray(n.tags) ? n.tags.map(String) : []
      };
      var idx = -1;
      for (var i = 0; i < state.items.length; i++) if (state.items[i].id === item.id) { idx = i; break; }
      if (idx >= 0) state.items[idx] = item; else state.items.push(item);
      added++;
    });
    /* Les prospects supprimés sur l’autre appareil le restent ici. */
    if (Array.isArray(data.removed)) {
      data.removed.forEach(function(id){
        if (typeof id !== "string" || state.removed.indexOf(id) !== -1) return;
        var kept = data.items.some(function(n){ return n && n.id === id; });
        if (kept) return;
        state.removed.push(id);
        state.items = state.items.filter(function(i){ return i.id !== id; });
      });
    }
    save(); closeSheets(); render(); toast(added + " prospect(s) restauré(s)");
  });

  renderFilter();
  render();
})();
</script>
</body>
</html>
